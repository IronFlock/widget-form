<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Tableedit</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #f5f5f5;
                font-family:
                    Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
                --font-family-serif: Helvetica;
                color: #291f42;
                font-weight: 400;
                line-height: 1.5;
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                width: 100%;
                height: 100%;
            }

            .widget {
            }

            /* The ?open= stand-in for a table's edit buttons, out of the
               global sizing rule above. */
            .toolbar,
            .toolbar * {
                width: auto;
                height: auto;
            }
            .toolbar {
                position: fixed;
                top: 8px;
                right: 8px;
                display: flex;
                gap: 8px;
                z-index: 1;
            }
        </style>
        <link
            rel="preload"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1"
            as="style"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <div id="demo"></div>
        <script src="https://storage.googleapis.com/reswarm-images/ObjectRandomizer.js"></script>

        <script type="module">
            import { render } from 'lit'
            import { html, unsafeStatic } from 'lit/static-html.js'
            import packageJson from '../package.json'
            import '../src/widget-form.js'
            import defaultData from '../src/default-data.json'
            import light from './themes/light.json'
            import chalk from './themes/chalk.json'
            import vintage from './themes/vintage.json'

            // Demo switches: ?theme=chalk|vintage, ?dialog (Form Open Button),
            // ?icon=<Material icon name> (its icon), ?label=<text> (a regular
            // button with this Label Text, Floating Action Button off; empty for
            // only the icon), ?size=small|medium|large (its size), ?radius=<px>
            // (its Corner Radius), ?accent=<colour> (Highlight Color), ?oldhost
            // (a Studio that does not know file-data-submit), ?layout (a Field
            // Layout, below), ?layout=none (no widths, new rows, sections or
            // density: the single column of 1.0.47 and earlier),
            // ?density=comfortable|compact (Material's 56px fields, or the 40px
            // ones a new form starts with; combines with the others),
            // ?open=<key> (Open on URL parameter, with the Form Open Button: the
            // demo then passes a route like Studio does, the page path with its
            // ?query, so ...&open=edit&edit=press-1 is the bookmark case; two
            // "Edit" buttons set the parameter like a table's edit column, and
            // a new inputData follows every route change 800 ms later, as the
            // re-queried bindings would, naming the record in Machine Name),
            // ?auto (Save on Change: no Reset or Submit, every change saves),
            // ?auto=settings (Save on Change on a two-setting form whose
            // pre-filled values the stand-in host updates after each save, as
            // bindings to the stored row would).
            const params = new URLSearchParams(location.search)
            const openKey = params.get('open')
            const themes = { light, chalk, vintage }
            const themeName = themes[params.get('theme')] ? params.get('theme') : 'light'
            if (themeName === 'chalk') document.body.style.backgroundColor = '#1f2833'

            // File, secret and colour fields stay out of default-data.json, which
            // seeds every new form tile; the demo adds two of each (the second
            // file field pre-filled, the colours a pre-filled one and a
            // translucent default).
            const demoFields = [
                ...defaultData.formFields,
                {
                    label: 'Document',
                    type: 'file',
                    required: true,
                    description: 'A file whose name contains "fail" is refused by the demo host',
                    fileNamespace: 'documents',
                    acceptedFileTypes: 'application/pdf, image/*',
                    maxFileSizeMB: 6,
                    fileUrlColumn: { tablename: 'documents', column: 'file_url' }
                },
                {
                    label: 'Attachment',
                    type: 'file',
                    fileNamespace: 'documents',
                    preFilledValue: '2026-10-15/k3x9q2m7a1/Maintenance report.pdf'
                },
                {
                    label: 'Device Password',
                    type: 'secret',
                    required: true,
                    description: 'At least 8 characters; the browser may offer to save it',
                    validation: '^.{8,}$',
                    validationMessage: 'Use at least 8 characters.',
                    browserPasswordManager: true
                },
                {
                    label: 'PIN',
                    type: 'secret',
                    description: '4 digits',
                    validation: '^[0-9]{4}$',
                    validationMessage: 'Enter exactly 4 digits.'
                },
                {
                    label: 'Line Color',
                    type: 'color',
                    required: true,
                    description: 'Pick one or type it, such as teal',
                    preFilledValueColor: '#E53935'
                },
                {
                    label: 'Fill Color',
                    type: 'color',
                    description: 'Left empty, the default is saved',
                    defaultValueColor: 'rgba(30, 136, 229, 0.5)'
                }
            ]

            // ?layout: Default Field Width ?width= (half unless given) and
            // Minimum Field Width ?minw=, a section shown only for compressors
            // (its Field Width in Group makes its fields quarters, one of them
            // on a new row), and pairs that must stay on one row as the form
            // narrows (three quarters + a quarter, two thirds + a third).
            const layout = params.get('layout')
            const widths = {
                Description: 'full',
                Document: 'two-thirds',
                Attachment: 'third',
                'Device Password': 'three-quarters',
                PIN: 'quarter',
                'Line Color': 'quarter',
                'Fill Color': 'quarter'
            }
            const compressorGroup = [
                {
                    label: 'Compressor settings',
                    type: 'section',
                    description: 'Shown for compressors only',
                    groupWidth: 'quarter',
                    conditionalDisplay: { conditionField: 'Machine Type', conditionValues: 'compressor' }
                },
                { label: 'Stages', type: 'numberfield', min: 1, max: 4 },
                { label: 'Pressure', type: 'numberfield', description: 'bar' },
                { label: 'Oil-free', type: 'checkbox', newRow: true }
            ]
            const settingsFields = [
                {
                    label: 'Maintenance mode',
                    type: 'checkbox',
                    description: 'Stops the line from taking new orders',
                    targetColumn: {
                        swarm_app_databackend_key: 1,
                        tablename: 'line_settings',
                        column: 'maintenance',
                        dataType: 'boolean'
                    },
                    preFilledValueBoolean: false
                },
                {
                    label: 'Speed',
                    type: 'dropdown',
                    targetColumn: {
                        swarm_app_databackend_key: 1,
                        tablename: 'line_settings',
                        column: 'speed',
                        dataType: 'string'
                    },
                    values: [
                        { displayLabel: 'Slow', value: 'slow' },
                        { displayLabel: 'Normal', value: 'normal' },
                        { displayLabel: 'Fast', value: 'fast' }
                    ],
                    preFilledValue: 'normal'
                }
            ]
            const formFields =
                layout === 'none'
                    ? demoFields
                          .filter((field) => field.type !== 'section')
                          .map(({ width, newRow, groupWidth, ...field }) => field)
                    : demoFields.flatMap((field) => {
                          // The demo's own fields get a section of their own, or
                          // they would join the default config's Maintenance
                          // group and take its width.
                          const attachments = { label: 'Attachments and access', type: 'section' }
                          if (layout === null) return field.label === 'Document' ? [attachments, field] : [field]
                          const placed = widths[field.label] ? { ...field, width: widths[field.label] } : field
                          if (field.label === 'Maintenance') return [...compressorGroup, placed]
                          if (field.label === 'Document') return [attachments, placed]
                          return [placed]
                      })

            const data = {
                ...defaultData,
                formButton: params.has('dialog') || openKey !== null,
                autoSubmit: params.has('auto'),
                openParameter: openKey ?? undefined,
                formButtonStyle: {
                    fab: !params.has('label'),
                    label: params.get('label') ?? undefined,
                    size: params.get('size') ?? undefined,
                    cornerRadius: params.has('radius') ? Number(params.get('radius')) : undefined,
                    iconName: params.get('icon') ?? undefined
                },
                accentColor: params.get('accent') ?? undefined,
                fieldLayout: {
                    defaultWidth: layout === null || layout === 'none' ? undefined : params.get('width') || 'half',
                    minFieldWidth: params.has('minw') ? Number(params.get('minw')) : undefined,
                    density: params.get('density') ?? (layout === 'none' ? undefined : defaultData.fieldLayout?.density)
                },
                formFields: params.get('auto') === 'settings' ? settingsFields : formFields
            }

            const tag = unsafeStatic(`widget-form-${packageJson.version}`)
            const theme = { theme_name: themeName, theme_object: themes[themeName] }
            render(
                html`
                    <${tag} class="widget" .theme="${theme}" .inputData=${data}>
                        web component is not registered. Make sure to use the tag with the correct version
                        string from the package.json
                    </${tag}>
                `,
                document.getElementById('demo')
            )
            const widget = document.getElementById('demo').children[0]
            console.log('data', data)

            // A stand-in for Studio: it logs what it would write, and for a
            // save with files "uploads" them for a second and a half, with the
            // URL it would write into a file field's URL column.
            widget.addEventListener('data-submit', (event) => console.log('data-submit', event.detail))

            // ?auto=settings: the stored row comes back through the pre-filled
            // values half a second after a save, as a realtime row does.
            if (params.get('auto') === 'settings') {
                widget.addEventListener('data-submit', (event) => {
                    setTimeout(() => {
                        for (const item of event.detail) {
                            const field = data.formFields.find(
                                (f) => f.targetColumn?.column === item.column_name
                            )
                            if (field?.type === 'checkbox') field.preFilledValueBoolean = item.value
                            else if (field) field.preFilledValue = item.value
                        }
                        widget.inputData = structuredClone(data)
                    }, 500)
                })
            }
            if (!params.has('oldhost')) {
                widget.addEventListener('file-data-submit', (event) => {
                    const { items, waitUntil } = event.detail
                    console.log('file-data-submit', items)
                    for (const item of items.filter((item) => item.file && item.urlColumn))
                        console.log(`would write https://files.example.com/f/1/${item.namespace}/<key> into ${item.urlColumn.column_name}`)
                    waitUntil(
                        new Promise((resolve, reject) =>
                            setTimeout(() => {
                                const refused = items.find((item) => item.file?.name.includes('fail'))
                                if (refused) reject(new Error(`The demo host refused “${refused.file.name}”. Nothing was saved.`))
                                else resolve()
                            }, 1500)
                        )
                    )
                })
            }

            if (openKey !== null) {
                // The record the URL names, pre-filled into Machine Name, sent
                // as a new inputData a while after each route change: Studio
                // re-queries the bindings and sends one after every change.
                const sendRecord = () => {
                    const record = new URLSearchParams(location.search).get(openKey)
                    setTimeout(() => {
                        widget.inputData = {
                            ...data,
                            formFields: data.formFields.map((field) =>
                                // Within the field's validation pattern (no hyphen).
                                field.label === 'Machine Name' && record !== null
                                    ? {
                                          ...field,
                                          preFilledValue: `Record ${record.replace(/[^a-zA-Z0-9 ]/g, ' ')}`
                                      }
                                    : field
                            )
                        }
                    }, 800)
                }
                const setRoute = () => {
                    widget.route = '/demo' + location.search
                    sendRecord()
                }
                // A stand-in for Studio's URL handling: merge the parameters
                // (undefined, null and '' delete a key), push the URL and pass
                // the new route.
                const setParams = (changes) => {
                    const url = new URL(location.href)
                    for (const [key, value] of Object.entries(changes)) {
                        if (value === undefined || value === null || value === '')
                            url.searchParams.delete(key)
                        else url.searchParams.set(key, value)
                    }
                    if (url.href === location.href) return
                    history.pushState(null, '', url)
                    setRoute()
                }
                widget.route = '/demo' + location.search
                widget.addEventListener('param-submit', (event) => {
                    console.log('param-submit', event.detail.params)
                    setParams(event.detail.params ?? {})
                })
                widget.addEventListener('nav-submit', (event) => {
                    console.log('nav-submit', event.detail.path)
                    setParams(Object.fromEntries(new URLSearchParams(event.detail.path.split('?')[1] ?? '')))
                })
                window.addEventListener('popstate', setRoute)
                const toolbar = document.createElement('div')
                toolbar.className = 'toolbar'
                for (const record of ['press-1', 'press-2']) {
                    const button = document.createElement('button')
                    button.textContent = `Edit ${record}`
                    button.addEventListener('click', () => setParams({ [openKey]: record }))
                    toolbar.append(button)
                }
                document.body.prepend(toolbar)
            } else {
                const keyPathsToRandomize = ['columns.1.values.0.value', 'columns.2.values.0.value']
                const inter = setInterval(() => {
                    const randomizedObj = randomizeObjectValues(data, keyPathsToRandomize)

                    // console.log('random', randomizedObj.dataseries[0].data[0])
                    widget.inputData = randomizedObj
                    // clearInterval(inter)
                }, 1000)
            }
        </script>
    </body>
</html>
